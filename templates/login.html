<!DOCTYPE html>
<html>
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login Admin</title>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css">
    <style>
        body { background: #fff5f8; display: flex; align-items: center; justify-content: center; height: 100vh; }
        .card { border-radius: 20px; padding: 30px; box-shadow: 0 10px 25px rgba(0,0,0,0.1); width: 100%; max-width: 350px; }
        .btn-primary { background: #d63384; border: none; }
    </style>
</head>
<body>
    <div class="card text-center">
        <h4 class="mb-4" style="color: #d63384;">Área Restrita</h4>
        <form method="POST">
            <input type="password" name="senha_login" class="form-control mb-3" placeholder="Digite a senha" required>
            <button type="submit" class="btn btn-primary w-100">Entrar</button>
        </form>
        <a href="/" class="btn btn-link mt-3 text-muted">Voltar para a loja</a>
    </div>
</body>
</html>
